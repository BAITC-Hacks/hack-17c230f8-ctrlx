<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WindCast · прогноз выработки ВЭС</title>
<style>
  :root {
    color-scheme: light;
    --ground: #f7f8fa;
    --surface: #ffffff;
    --ink: #16202b;
    --ink-soft: #5a6674;
    --ink-faint: #8b95a1;
    --grid: #dce1e8;
    --accent: #0e7c86;
    --accent-soft: rgba(14, 124, 134, 0.14);
    --accent-faint: rgba(14, 124, 134, 0.07);
    --warn: #b45309;
    --warn-bg: #fdf6ec;
    --fail: #b4232f;
    --radius: 10px;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px 48px;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1240px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- header ---- */
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .tagline { color: var(--ink-soft); font-size: 15px; }
  .mode {
    margin-left: auto; font: 600 12px/1 var(--mono); letter-spacing: 0.04em;
    padding: 5px 8px; border-radius: 5px; border: 1px solid var(--grid); color: var(--ink-soft);
  }
  .mode[data-mode="llm"] { color: #0f6b4f; border-color: #bfe0d2; background: #f0faf5; }

  /* ---- issue bar ---- */
  .issuebar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 16px 0; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--grid); border-radius: var(--radius);
  }
  .issuebar label { font-size: 13px; color: var(--ink-soft); }
  button, select {
    font: inherit; font-size: 14px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--grid); border-radius: 7px;
    padding: 6px 10px; cursor: pointer;
    transition: transform 140ms var(--ease), border-color 140ms ease, background 140ms ease;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { color: var(--ink-faint); cursor: default; }
  button:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .step-btn { font: 600 15px/1 var(--mono); padding: 7px 11px; }
  .issue-meta { font-size: 13px; color: var(--ink-soft); display: flex; gap: 14px; flex-wrap: wrap; }
  .issue-meta b { color: var(--ink); font-weight: 600; }

  /* ---- cards ---- */
  .card {
    background: var(--surface); border: 1px solid var(--grid);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .card h2 {
    font-size: 15px; font-weight: 650; margin: 0 0 12px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .card h2 span { font-weight: 400; font-size: 13px; color: var(--ink-faint); }

  /* ---- stats ---- */
  .stats { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat-v { font: 600 26px/1.1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat-l { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .stat-warn .stat-v { color: var(--warn); }

  /* ---- chart ---- */
  .chartwrap { position: relative; }
  svg.chart { display: block; width: 100%; height: auto; touch-action: none; }
  .anim-reveal { animation: reveal 260ms var(--ease) both; transform-origin: 50% 100%; }
  @keyframes reveal { from { opacity: 0; transform: scaleY(0.97); } }
  .tip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--ink); color: #fff; border-radius: 7px;
    padding: 7px 9px; font-size: 12.5px; line-height: 1.45; white-space: nowrap;
    transition: opacity 120ms ease; transform: translate(-50%, -100%); z-index: 2;
  }
  .tip.on { opacity: 1; }
  .tip .num { font-family: var(--mono); }

  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
    margin-top: 12px; font-size: 13px; color: var(--ink-soft);
  }
  .swatch { display: inline-block; width: 22px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
  .seg { display: flex; gap: 6px; margin-left: auto; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---- two columns ---- */
  .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  /* ---- agent trace ---- */
  ol.trace { list-style: none; margin: 0; padding: 0; }
  ol.trace li {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--grid);
    animation: stepin 220ms var(--ease) both;
  }
  ol.trace li:first-child { border-top: 0; }
  @keyframes stepin { from { opacity: 0; transform: translateY(4px); } }
  .n { font: 600 13px/1.7 var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .tool { font: 600 14px/1.5 var(--mono); }
  .sum { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .dec {
    font-size: 13px; margin-top: 5px; padding: 6px 8px; border-radius: 6px;
    background: var(--ground); border-left: 2px solid var(--grid);
  }
  .dec b { font-weight: 600; }
  li[data-st="warn"] .dec { background: var(--warn-bg); border-left-color: var(--warn); }
  .ms { font: 13px/1.7 var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .st { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .st[data-st="ok"] { color: var(--ink-faint); }
  .st[data-st="warn"] { color: var(--warn); }
  .st[data-st="fail"] { color: var(--fail); }

  /* ---- summary / warnings / metrics ---- */
  .summary p { margin: 0 0 9px; font-size: 14.5px; }
  .summary p:last-child { margin-bottom: 0; }
  .summary strong { font-weight: 650; }
  .warnbox {
    margin-top: 12px; padding: 10px 12px; border-radius: 7px;
    background: var(--warn-bg); border: 1px solid #f0dcc0; font-size: 13.5px;
  }
  .warnbox h3 { margin: 0 0 6px; font-size: 13.5px; color: var(--warn); }
  .warnbox ul { margin: 0; padding-left: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 8px; text-align: right; border-top: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  /* ---- agentic evidence: ablation bars ---- */
  .abl-row { display: grid; grid-template-columns: minmax(200px, 2fr) 3fr auto; gap: 12px; align-items: center; padding: 5px 0; }
  .abl-name { font-size: 14px; color: var(--ink-soft); }
  .abl-bar { background: var(--ground); border-radius: 3px; height: 14px; overflow: hidden; }
  .abl-bar i { display: block; height: 100%; background: var(--grid); border-radius: 3px; }
  .abl-v { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  @media (max-width: 700px) { .abl-row { grid-template-columns: 1fr auto; } .abl-bar { display: none; } }

  .empty { color: var(--ink-faint); font-size: 14px; }
  .err { color: var(--fail); font-size: 14px; }

  @media (hover: hover) and (pointer: fine) {
    button:hover:not(:disabled) { border-color: var(--ink-faint); }
  }
  @media (prefers-reduced-motion: reduce) {
    .anim-reveal, ol.trace li { animation: none; }
    button:active:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>WindCast</h1>
    <span class="tagline">почасовой прогноз выработки ВЭС на 48 часов</span>
    <span class="mode" id="mode">…</span>
  </header>

  <div class="issuebar">
    <label for="issue">Выпуск</label>
    <button class="step-btn" id="prev" aria-label="Предыдущий выпуск">←</button>
    <select id="issue"></select>
    <button class="step-btn" id="next" aria-label="Следующий выпуск">→</button>
    <div class="issue-meta" id="issue-meta"></div>
  </div>

  <section class="card" aria-labelledby="ch-h">
    <h2 id="ch-h">Ожидаемая выработка <span>% от номинала, локальное время Алматы</span></h2>
    <div class="stats" id="stats"></div>
    <div class="chartwrap">
      <svg class="chart" id="chart" viewBox="0 0 1000 300" role="img" aria-labelledby="ch-desc"></svg>
      <p id="ch-desc" hidden></p>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="cols">
    <section class="card" aria-labelledby="tr-h">
      <h2 id="tr-h">Что делал агент <span id="tr-sub"></span></h2>
      <ol class="trace" id="trace"></ol>
    </section>
    <div>
      <section class="card" aria-labelledby="sm-h">
        <h2 id="sm-h">Сводка диспетчеру</h2>
        <div class="summary" id="summary"></div>
        <div id="warnings"></div>
      </section>
      <section class="card" style="margin-top:16px" aria-labelledby="mt-h">
        <h2 id="mt-h">Точность на бэктесте</h2>
        <div id="metrics"></div>
      </section>
    </div>
  </div>

  <section class="card" style="margin-top:16px" aria-labelledby="ev-h">
    <h2 id="ev-h">Что даёт агент <span>измерено, а не заявлено</span></h2>
    <div id="evidence"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const api = async (p) => {
  const r = await fetch(`/api${p}`);
  if (!r.ok) throw new Error(`${p} → ${r.status}`);
  return r.json();
};
// Everything the API returns is text we did not write: the dispatcher summary comes from
// report.md (an LLM writes it once R9 lands) and the agent's own summary/decision/reason strings.
// It all lands in innerHTML, so escape before interpolating.
const esc = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pct = (v) => `${Math.round(v * 100)}%`;
const hhmm = (iso) => iso.slice(11, 16);
const dm = (iso) => `${iso.slice(8, 10)}.${iso.slice(5, 7)}`;

// previous_dayN = how stale the weather run was that the agent was allowed to use.
const FRESH = {
  day1: { label: "day1 · прогноз сутки назад", fill: "var(--accent-soft)", hatch: false },
  day2: { label: "day2 · двое суток назад", fill: "var(--accent-faint)", hatch: true },
  day3: { label: "day3 · трое суток назад", fill: "var(--accent-faint)", hatch: true },
  // contract allows "none": no admissible weather run, the agent fell back to climatology.
  // Must not be shown as a day3 forecast -- there was no forecast at all for those hours.
  none: { label: "без прогноза погоды · климатология", fill: "rgba(180, 83, 9, 0.10)", hatch: true },
};
const FRESH_UNKNOWN = { label: "источник погоды неизвестен", fill: "var(--accent-faint)", hatch: true };

let issues = [], idx = 0, rows = [], superseded = [], series = "power_farm";

/** One row per target hour: the newest revision wins. Rows a later revision replaced are kept
 *  separately so the chart can show what the t0+12h recompute actually changed. */
function splitRevisions(all) {
  const best = new Map();
  for (const r of all) {
    const k = +r.lead_h;
    const cur = best.get(k);
    if (!cur || +r.revision > +cur.revision) best.set(k, r);
  }
  const eff = [...best.values()].sort((a, b) => +a.lead_h - +b.lead_h);
  const old = all
    .filter((r) => +r.revision < +best.get(+r.lead_h).revision)
    .sort((a, b) => +a.lead_h - +b.lead_h);
  return [eff, old];
}

// ---------- chart ----------
const M = { l: 44, r: 12, t: 10, b: 30 }, W = 1000, H = 300;
const plotW = W - M.l - M.r, plotH = H - M.t - M.b;

function draw() {
  const svg = $("chart");
  if (!rows.length) { svg.innerHTML = ""; return; }
  const n = rows.length;
  // x is keyed on lead_h, not row index, so a superseded revision lands on the same hour
  const maxLead = Math.max(...rows.map((r) => +r.lead_h)) || 1;
  const x = (lead) => M.l + (lead * plotW) / maxLead;
  const y = (v) => M.t + plotH - v * plotH;           // power is normalised 0..1
  const val = (r) => +r[series];

  // y grid at 0 / 25 / 50 / 75 / 100 %
  let g = "";
  for (let p = 0; p <= 1.0001; p += 0.25) {
    g += `<line x1="${M.l}" y1="${y(p)}" x2="${W - M.r}" y2="${y(p)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${M.l - 8}" y="${y(p) + 4}" text-anchor="end" font-size="12" fill="var(--ink-faint)" font-family="var(--mono)">${Math.round(p * 100)}</text>`;
  }
  const L = (r) => +r.lead_h;

  // Uncertainty band, split into runs of equal wx_field so staleness is visible without hover.
  // p10/p90 are farm-level (contract): drawing them under a single-turbine line would put two
  // different physical quantities in one picture, so the band only shows for the farm series.
  const bandShown = series === "power_farm";
  let bands = "";
  let s = 0;
  for (let i = 1; bandShown && i <= n; i++) {
    if (i === n || rows[i].wx_field !== rows[s].wx_field) {
      const seg = rows.slice(s, i);
      const top = seg.map((r) => `${x(L(r))},${y(+r.p90)}`).join(" ");
      const bot = seg.map((r) => `${x(L(r))},${y(+r.p10)}`).reverse().join(" ");
      const f = FRESH[rows[s].wx_field] || FRESH_UNKNOWN;
      bands += `<polygon points="${top} ${bot}" fill="${f.fill}"/>`;
      if (f.hatch) bands += `<polygon points="${top} ${bot}" fill="url(#hatch)"/>`;
      s = i;
    }
  }

  const path = (arr) => arr.map((r, i) => `${i ? "L" : "M"}${x(L(r))},${y(val(r))}`).join("");
  const line = path(rows);
  // what the t0+12h recompute replaced: the old revision, dashed, so the change is visible
  const oldLine = superseded.length
    ? `<path d="${path(superseded)}" fill="none" stroke="var(--ink-faint)" stroke-width="1.5"
         stroke-dasharray="4 3" opacity="0.75"/>`
    : "";
  let reMark = "";
  if (superseded.length) {
    const lead0 = L(superseded[0]);
    reMark = `<line x1="${x(lead0)}" y1="${M.t}" x2="${x(lead0)}" y2="${M.t + plotH}"
                stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
              <text x="${x(lead0) + 5}" y="${M.t + plotH - 6}" font-size="11.5" fill="var(--accent)">пересчёт t0+12 ч →</text>`;
  }

  // 6-hour ticks; midnight also carries the date, so day 2 is never mistaken for day 1
  let xs = "";
  for (const r of rows) {
    if (L(r) % 6) continue;
    const t = r.target_time_local;
    const midnight = hhmm(t) === "00:00";
    xs += `<text x="${x(L(r))}" y="${H - 9}" text-anchor="middle" font-size="12" font-family="var(--mono)"
      fill="${midnight ? "var(--ink-soft)" : "var(--ink-faint)"}" font-weight="${midnight ? 600 : 400}">${midnight ? dm(t) : hhmm(t)}</text>`;
  }
  let div = "";
  if (maxLead >= 24) {
    div = `<line x1="${x(24)}" y1="${M.t}" x2="${x(24)}" y2="${M.t + plotH}" stroke="var(--ink-faint)" stroke-width="1" stroke-dasharray="3 3"/>
           <text x="${x(24) + 6}" y="${M.t + 13}" font-size="12" fill="var(--ink-soft)">48 ч →</text>
           <text x="${x(24) - 6}" y="${M.t + 13}" font-size="12" fill="var(--ink-soft)" text-anchor="end">← 24 ч</text>`;
  }

  svg.innerHTML = `
    <defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--accent)" stroke-opacity="0.18" stroke-width="1"/>
    </pattern></defs>
    ${g}
    <g class="anim-reveal">${bands}${div}${reMark}${oldLine}
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round"/>
    </g>
    ${xs}
    <line class="cross" x1="0" y1="${M.t}" x2="0" y2="${M.t + plotH}" stroke="var(--accent)" stroke-width="1" opacity="0"/>
    <circle class="dot" r="4" fill="var(--accent)" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect x="${M.l}" y="${M.t}" width="${plotW}" height="${plotH}" fill="transparent" id="hit"/>`;

  $("ch-desc").textContent = `Прогноз на ${n} часов, ${series}.`;
  wireHover(x, y, val);
}

function wireHover(x, y, val) {
  const svg = $("chart"), tip = $("tip"), hit = svg.querySelector("#hit");
  const cross = svg.querySelector(".cross"), dot = svg.querySelector(".dot");
  const move = (ev) => {
    const box = svg.getBoundingClientRect();
    const px = ((ev.clientX - box.left) / box.width) * W;
    const maxLead = Math.max(...rows.map((q) => +q.lead_h)) || 1;
    const lead = Math.max(0, Math.min(maxLead, Math.round(((px - M.l) / plotW) * maxLead)));
    const r = rows.reduce((a, b) => (Math.abs(+b.lead_h - lead) < Math.abs(+a.lead_h - lead) ? b : a));
    const cx = x(+r.lead_h);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", "0.45");
    dot.setAttribute("cx", cx); dot.setAttribute("cy", y(val(r))); dot.setAttribute("opacity", "1");
    const was = superseded.find((q) => +q.lead_h === +r.lead_h);
    tip.innerHTML = `<b>${dm(r.target_time_local)} ${hhmm(r.target_time_local)}</b> · +${r.lead_h} ч
      <br>выработка <span class="num">${pct(val(r))}</span>${series === "power_farm"
        ? ` · p10–p90 <span class="num">${pct(+r.p10)}–${pct(+r.p90)}</span>` : ""}
      <br>ветер <span class="num">${(+r.ws100_fc).toFixed(1)}</span> м/с · погода ${esc(r.wx_field)}
      ${was ? `<br>до пересчёта было <span class="num">${pct(+was[series])}</span>` : ""}`;
    tip.style.left = `${(cx / W) * 100}%`;
    tip.style.top = `${(y(val(r)) / H) * box.height - 12}px`;
    tip.classList.add("on");
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", () => {
    tip.classList.remove("on");
    cross.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0");
  });
}

// ---------- panels ----------
function renderStats() {
  const v = rows.map((r) => +r[series]);
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  const pk = rows[v.indexOf(Math.max(...v))];
  const width = rows.reduce((a, r) => a + (+r.p90 - +r.p10), 0) / rows.length;
  const calm = v.filter((x) => x < 0.1).length;
  $("stats").innerHTML = `
    <div><div class="stat-v">${pct(mean)}</div><div class="stat-l">среднее за 48 ч</div></div>
    <div><div class="stat-v">${pct(Math.max(...v))}</div><div class="stat-l">пик · ${dm(pk.target_time_local)} ${hhmm(pk.target_time_local)}</div></div>
    <div><div class="stat-v">±${pct(width / 2)}</div><div class="stat-l">средняя неопределённость, по парку</div></div>
    <div class="${calm ? "stat-warn" : ""}"><div class="stat-v">${calm} ч</div><div class="stat-l">штиль, ниже 10%</div></div>`;
}

function renderLegend() {
  const used = [...new Set(rows.map((r) => r.wx_field))].sort();
  const chips = used.map((f) => {
    const c = FRESH[f] || FRESH_UNKNOWN;
    const bg = c.hatch
      ? `background:var(--accent-faint);background-image:repeating-linear-gradient(45deg,rgba(14,124,134,.3) 0 1px,transparent 1px 5px)`
      : `background:var(--accent-soft)`;
    return `<span><span class="swatch" style="${bg}"></span>${c.label}</span>`;
  }).join("");
  $("legend").innerHTML = `
    <span><span class="swatch" style="background:var(--accent);height:3px;border-radius:2px"></span>ожидаемая выработка</span>
    ${series === "power_farm" ? "" : `<span style="color:var(--warn)">коридор p10–p90 считается по парку, для одной турбины не показан</span>`}
    ${superseded.length ? `<span><span class="swatch" style="height:0;border-top:1.5px dashed var(--ink-faint)"></span>до пересчёта в t0+12 ч</span>` : ""}
    ${chips}
    <span class="seg" role="group" aria-label="Разрез">
      ${[["power_farm", "парк"], ["power_t1", "турбина 1"], ["power_t2", "турбина 2"]]
        .map(([k, l]) => `<button data-s="${k}" aria-pressed="${series === k}">${l}</button>`).join("")}
    </span>`;
  $("legend").querySelectorAll("[data-s]").forEach((b) =>
    b.addEventListener("click", () => { series = b.dataset.s; draw(); renderStats(); renderLegend(); }));
}

function renderTrace(steps) {
  $("tr-sub").textContent = steps.length ? `${steps.length} шагов` : "";
  if (!steps.length) { $("trace").innerHTML = `<li class="empty">лог прогона пуст</li>`; return; }
  const word = { ok: "ок", warn: "внимание", fail: "сбой" };
  $("trace").innerHTML = steps.map((s, i) => `
    <li data-st="${s.status}" style="animation-delay:${Math.min(i * 50, 400)}ms">
      <span class="n">${s.step}</span>
      <div>
        <div class="tool">${esc(s.tool)}</div>
        <div class="sum">${esc(s.summary)}</div>
        ${s.decision ? `<div class="dec"><b>${esc(s.decision)}</b>${s.reason ? ` — ${esc(s.reason)}` : ""}</div>` : ""}
      </div>
      <div style="text-align:right">
        <div class="st" data-st="${s.status}">${s.status === "ok" ? "" : "⚠ "}${word[s.status]}</div>
        <div class="ms">${s.duration_ms} мс</div>
      </div>
    </li>`).join("");
}

function renderSummary(issue) {
  const text = (issue.summary || "").split("\n")
    .filter((l) => l.trim() && !l.startsWith("#"))
    // escape first, then turn **bold** into the one tag we do allow: the summary is markdown
    // written by the agent (an LLM once R9 lands), so any other markup must stay inert text
    .map((l) => esc(l.replace(/^[-*]\s*/, "")).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"));
  $("summary").innerHTML = text.length
    ? text.map((l) => `<p>${l}</p>`).join("")
    : `<p class="empty">сводка появится после прогона агента</p>`;
  $("warnings").innerHTML = issue.warnings?.length
    ? `<div class="warnbox"><h3>⚠ Шаги агента с замечаниями: ${issue.warnings.length}</h3>
       <ul>${issue.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>`
    : "";
}

function renderMetrics(reports) {
  if (!reports.length) { $("metrics").innerHTML = `<p class="empty">метрики считаются — появятся после бэктеста</p>`; return; }
  // every hold-out period, not just one: which file was generated last is not a criterion
  $("metrics").innerHTML = reports.map((r) => `
    <p class="stat-l" style="margin:0 0 6px"><b>период ${esc(r.period)}</b> · обучено до ${esc(r.train_end)}</p>
    <table style="margin-bottom:14px"><thead><tr><th>модель</th><th>гориз.</th><th>MAE</th><th>nMAE</th><th>сдвиг</th><th>n</th></tr></thead>
    <tbody>${r.rows.map((m) => `<tr>
      <td>${esc(m.model)}</td><td class="num">${esc(m.horizon)}</td>
      <td class="num">${m.mae.toFixed(3)}</td><td class="num">${m.nmae.toFixed(1)}%</td>
      <td class="num">${m.bias >= 0 ? "+" : ""}${m.bias.toFixed(3)}</td><td class="num">${m.n}</td>
    </tr>`).join("")}</tbody></table>`).join("");
}

// The evidence JSON is written in English by the CLI; the page is Russian. Map what we know,
// fall back to the original string so a new variant or decision still shows up verbatim.
const RU = {
  "A persistence (mean of the last 24 h)": "A — персистентность (среднее за 24 ч)",
  "B fixed pipeline: power curve, no checks, no recompute": "B — фиксированный пайплайн: кривая мощности, без проверок",
  "C model only: gradient boosting at t0, no recompute": "C — только модель: бустинг в t0, без пересчёта",
  "D agent: checks, fallbacks, recompute at t0+12 h (published plan)": "D — агент: проверки, фолбэки, пересчёт в t0+12 ч",
  "use gradient boosting instead of the power curve (analyze → accept)": "взять бустинг вместо кривой мощности",
  "recompute at t0+12 h with fresher runs (revision 1)": "пересчёт в t0+12 ч по свежим прогонам",
  "fallback to a simpler model after a failed check": "фолбэк на простую модель после провала проверки",
  "switch the weather source after failed validation": "смена источника погоды после провала валидации",
  "drift flag from the self-check (recommend retraining, no silent change)": "флаг дрейфа по самопроверке",
  "6 hours of wind missing in the primary source": "в основном источнике нет 6 часов ветра",
  "wind spike 100 m/s in the primary source": "выброс 100 м/с в основном источнике",
  "primary source unavailable": "основной источник недоступен",
  "both sources broken": "оба источника сломаны",
  "switch → gfs_seamless": "переключился на gfs_seamless",
  "climatology": "перешёл на климатологию",
};
const ru = (s) => RU[s] || s;

function renderEvidence(ev) {
  const box = $("evidence");
  if (!ev || (!ev.replay && !ev.faults)) {
    box.innerHTML = `<p class="empty">доказательства не сгенерированы — <code>uv run python -m app.cli replay --month 2026-01</code></p>`;
    return;
  }
  const r = ev.replay, f = ev.faults;
  let html = "";

  if (r) {
    // ablation: each variant's bar is scaled to the worst one, so the gain reads at a glance
    const worst = Math.max(...r.ablation.map((a) => a.mae));
    html += `<p class="stat-l" style="margin:0 0 10px">Один и тот же месяц (${r.month}), ${r.issues} выпусков,
      ${r.rows_scored} оценённых часов. Меньше MAE — точнее.</p>
      <div class="abl">${r.ablation.map((a, i) => `
        <div class="abl-row">
          <span class="abl-name">${esc(ru(a.variant))}</span>
          <span class="abl-bar"><i style="width:${(a.mae / worst) * 100}%;${i === r.ablation.length - 1 ? "background:var(--accent)" : ""}"></i></span>
          <span class="num abl-v">${a.mae.toFixed(3)}</span>
        </div>`).join("")}</div>`;

    const fired = r.decisions.filter((d) => d.fired > 0);
    const idle = r.decisions.filter((d) => !d.fired);
    if (fired.length) {
      html += `<table style="margin-top:14px"><thead><tr>
        <th>решение агента</th><th>сработало</th><th>Δ MAE</th><th>95% ДИ</th></tr></thead><tbody>
        ${fired.map((d) => {
          const crosses = d.ci95 && d.ci95[0] < 0 && d.ci95[1] > 0;
          return `<tr>
            <td>${esc(ru(d.decision))}</td>
            <td class="num">${d.fired}</td>
            <td class="num">${d.mean_delta_mae.toFixed(4)}</td>
            <td class="num"${crosses ? ` style="color:var(--warn)"` : ""}>
              ${d.ci95 ? `[${d.ci95[0].toFixed(4)}; ${d.ci95[1].toFixed(4)}]${crosses ? " ⚠" : ""}` : "—"}</td>
          </tr>`;
        }).join("")}</tbody></table>
        <p class="stat-l" style="margin-top:8px">Отрицательная Δ — решение уменьшило ошибку.
        ⚠ означает, что доверительный интервал пересекает ноль: выигрыш на этом месяце не доказан.</p>`;
    }
    if (idle.length) {
      html += `<p class="stat-l" style="margin-top:6px">В нормальном режиме ни разу не сработали:
        ${idle.map((d) => esc(ru(d.decision))).join("; ")} — их ценность проверяется сценариями сбоев ниже.</p>`;
    }
  }

  if (f) {
    html += `<h3 style="font-size:14px;margin:18px 0 8px">Поведение при сбоях · выпуск ${esc(f.issue)}</h3>
      <table><thead><tr><th>сбой</th><th>агент</th><th>фиксированный пайплайн</th></tr></thead><tbody>
      ${f.cases.map((c) => {
        const bad = c.fixed_pipeline.hours_from_broken_input;
        return `<tr>
          <td>${esc(ru(c.case))}</td>
          <td class="num" style="color:var(--accent)">${c.agent.valid_hours} ч · ${esc(ru(c.agent.decision))}</td>
          <td class="num"${c.fixed_pipeline.valid_hours < 48 || bad ? ` style="color:var(--warn)"` : ""}>
            ${c.fixed_pipeline.valid_hours} ч${bad ? ` · ${bad} ч по битому входу` : ""}</td>
        </tr>`;
      }).join("")}</tbody></table>
      <p class="stat-l" style="margin-top:8px">Агент выдал полный горизонт в
        ${f.cases.filter((c) => c.agent.valid_hours === f.horizon_h).length} случаях из ${f.cases.length},
        каждое решение записано в журнал прогона.</p>`;
  }
  box.innerHTML = html;
}

// ---------- load ----------
async function loadIssue() {
  const it = issues[idx];
  $("issue").value = it.issue_date;
  $("prev").disabled = idx === 0;
  $("next").disabled = idx === issues.length - 1;
  try {
    const issue = await api(`/forecast/${it.issue_date}`);
    [rows, superseded] = splitRevisions(issue.rows);
    $("issue-meta").innerHTML = `
      <span>t0 <b>${dm(rows[0].issue_time_local)} ${hhmm(rows[0].issue_time_local)}</b> Алматы</span>
      <span>модель <b>${esc(issue.model_name)}</b></span>
      <span>погода <b>${esc(rows[0].wx_model)}</b></span>
      <span>ревизия <b>${issue.revision}</b>${superseded.length ? ` · пересчитано часов: ${superseded.length}` : ""}</span>
      ${issue.fallback_used ? `<span style="color:var(--warn)"><b>⚠ был фолбэк</b></span>` : ""}`;
    draw(); renderStats(); renderLegend(); renderSummary(issue);
    renderTrace(await api(`/runs/${issue.run_id}/log`).catch(() => []));
  } catch (e) {
    $("stats").innerHTML = `<p class="err">не удалось загрузить выпуск: ${e.message}</p>`;
  }
}

(async () => {
  try {
    const h = await api("/health");
    $("mode").textContent = h.mode === "llm" ? "LLM" : "DEMO";
    $("mode").dataset.mode = h.mode;
  } catch { $("mode").textContent = "—"; }

  renderMetrics(await api("/metrics").catch(() => []));
  renderEvidence(await api("/evidence").catch(() => null));

  try {
    issues = await api("/issues");
  } catch (e) {
    $("stats").innerHTML = `<p class="err">API недоступен: ${e.message}</p>`;
    return;
  }
  if (!issues.length) {
    $("stats").innerHTML = `<p class="empty">выпусков ещё нет — запустите <code>uv run python -m app.cli backtest</code></p>`;
    $("trace").innerHTML = `<li class="empty">—</li>`;
    $("summary").innerHTML = `<p class="empty">—</p>`;
    return;
  }
  $("issue").innerHTML = issues.map((i) => `<option value="${i.issue_date}">${i.issue_date}</option>`).join("");
  idx = issues.length - 1;
  $("issue").addEventListener("change", (e) => { idx = issues.findIndex((i) => i.issue_date === e.target.value); loadIssue(); });
  $("prev").addEventListener("click", () => { if (idx > 0) { idx--; loadIssue(); } });
  $("next").addEventListener("click", () => { if (idx < issues.length - 1) { idx++; loadIssue(); } });
  loadIssue();
})();
</script>
</body>
</html>
