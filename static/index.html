<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CtrlX · HackAlem</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-contrast: #ffffff;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --badge-llm: #059669;
    --badge-demo: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.375rem;
    margin: 0 0 1.25rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--card);
  }
  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }
  button {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.1rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .hint {
    color: var(--muted);
    font-size: 0.85rem;
  }
  #result-card {
    display: none;
  }
  .result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  .label {
    font-size: 1.1rem;
    font-weight: 700;
  }
  .badge {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.llm {
    color: var(--badge-llm);
    background: color-mix(in srgb, var(--badge-llm) 15%, transparent);
  }
  .badge.demo {
    color: var(--badge-demo);
    background: color-mix(in srgb, var(--badge-demo) 15%, transparent);
  }
  .badge.pii {
    color: var(--muted);
    background: color-mix(in srgb, var(--muted) 15%, transparent);
  }
  .badge-group {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
  }
  .score-bar {
    flex: 1;
    height: 8px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .score-bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
  }
  .score-value {
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    color: var(--muted);
    min-width: 3.5ch;
    text-align: right;
  }
  .summary {
    margin: 0 0 0.75rem;
    line-height: 1.5;
  }
  .reasons {
    margin: 0;
    padding-left: 1.1rem;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.6;
  }
  #error-card {
    display: none;
    background: var(--danger-bg);
    border-color: color-mix(in srgb, var(--danger) 35%, transparent);
    color: var(--danger);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>CtrlX · HackAlem</h1>

  <section class="card">
    <textarea id="text" placeholder="Вставьте текст для анализа…"></textarea>
    <div class="actions">
      <button id="submit">Анализировать</button>
      <span class="hint" id="hint"></span>
    </div>
  </section>

  <section class="card" id="result-card">
    <div class="result-head">
      <span class="label" id="result-label"></span>
      <div class="badge-group">
        <span class="badge" id="result-badge"></span>
        <span class="badge pii" id="result-pii" style="display: none"></span>
      </div>
    </div>
    <div class="score-row">
      <div class="score-bar"><span id="score-fill"></span></div>
      <span class="score-value" id="score-value"></span>
    </div>
    <p class="summary" id="result-summary"></p>
    <ul class="reasons" id="result-reasons"></ul>
  </section>

  <section class="card" id="error-card"></section>
</main>

<script>
  const textEl = document.getElementById("text");
  const submitEl = document.getElementById("submit");
  const hintEl = document.getElementById("hint");
  const resultCard = document.getElementById("result-card");
  const errorCard = document.getElementById("error-card");
  const labelEl = document.getElementById("result-label");
  const badgeEl = document.getElementById("result-badge");
  const piiEl = document.getElementById("result-pii");
  const scoreFillEl = document.getElementById("score-fill");
  const scoreValueEl = document.getElementById("score-value");
  const summaryEl = document.getElementById("result-summary");
  const reasonsEl = document.getElementById("result-reasons");

  function resetPanels() {
    resultCard.style.display = "none";
    errorCard.style.display = "none";
  }

  function showError(message) {
    resetPanels();
    errorCard.textContent = message;
    errorCard.style.display = "block";
  }

  function showResult(data) {
    resetPanels();
    labelEl.textContent = data.label;
    badgeEl.textContent = data.mode === "llm" ? "LLM" : "DEMO · без ключа";
    badgeEl.className = "badge " + (data.mode === "llm" ? "llm" : "demo");
    if (typeof data.masked_pii === "number" && data.masked_pii > 0) {
      piiEl.textContent = "ПДн скрыты: " + data.masked_pii;
      piiEl.style.display = "inline-block";
    } else {
      piiEl.style.display = "none";
    }
    const pct = Math.round(data.score * 100);
    scoreFillEl.style.width = pct + "%";
    scoreValueEl.textContent = pct + "%";
    summaryEl.textContent = data.summary;
    reasonsEl.innerHTML = "";
    for (const reason of data.reasons || []) {
      const li = document.createElement("li");
      li.textContent = reason;
      reasonsEl.appendChild(li);
    }
    resultCard.style.display = "block";
  }

  async function analyze() {
    const text = textEl.value.trim();
    if (!text) {
      showError("Введите текст перед анализом.");
      return;
    }

    submitEl.disabled = true;
    hintEl.textContent = "Анализирую…";
    resetPanels();

    try {
      const res = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });

      if (!res.ok) {
        let detail = res.statusText;
        try {
          const body = await res.json();
          detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
        } catch (_) {
          // response body wasn't JSON - keep statusText
        }
        showError(`Ошибка ${res.status}: ${detail}`);
        return;
      }

      showResult(await res.json());
    } catch (err) {
      showError("Не удалось связаться с сервером: " + err.message);
    } finally {
      submitEl.disabled = false;
      hintEl.textContent = "";
    }
  }

  submitEl.addEventListener("click", analyze);
  textEl.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") analyze();
  });
</script>
</body>
</html>
